name: Scheduled jobs

# Vercel's free plan runs a cron once a day, but the app used to check for work hourly. This workflow calls the same authenticated
# endpoint every hour. Every job behind it keeps its own once-per-day / once-per-week claim, so extra calls are harmless: the
# daily discovery only runs inside its 08:00 KST window, collection only picks sources that are due, and nothing runs twice.
#
# Needs one repository secret: CRON_SECRET (Settings > Secrets and variables > Actions) with the same value as the CRON_SECRET
# environment variable in Vercel. Optional repository variable APP_URL overrides the address below.
# GitHub runs scheduled workflows from the default branch only.
on:
  schedule:
    - cron: '7 * * * *'
    # the morning discovery run needs several calls to get through every source (each call advances a saved cursor): 07:00-10:59 KST every
    # 10 min. GitHub drops or delays scheduled runs now and then, so the triggers overlap on purpose; the concurrency group below keeps
    # them from running at the same time, and a run that finds nothing to do is a few seconds long.
    - cron: '*/10 22,23,0,1 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  call-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Call /api/cron/daily
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://oilfats-research.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          # The run keeps calling the endpoint until the morning discovery reports done (each call advances a saved cursor), so a hop
          # that died or a trigger GitHub skipped never leaves collection half finished and needs no one to restart it.
          # bounded by time, not by call count: a call that only finds a chained hop holding the lease returns in seconds
          end=$((SECONDS + 3900))
          i=0
          bad=0
          while [ "$SECONDS" -lt "$end" ]; do
            i=$((i + 1))
            code=$(curl -sS -m 290 -o out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily" || true)
            echo "call $i: HTTP $code"
            cat out.json 2>/dev/null | head -c 3000; echo
            # a 3xx means the domain moved (the old research-archiving.vercel.app now redirects to oilfats-research.vercel.app): curl does not
            # follow it, and following would drop the Authorization header — fix APP_URL instead
            case "$code" in 401|403|404) echo "::error::HTTP $code — wrong CRON_SECRET or APP_URL, retrying will not help"; exit 1;; esac
            case "$code" in 3*) echo "::error::HTTP $code redirect from $APP_URL — update the APP_URL variable / workflow default to the new domain"; exit 1;; esac
            if [ "$code" != "200" ]; then
              # timeout (000) or a 5xx: the chain and the saved cursor survive it, so retry — but not forever
              bad=$((bad + 1))
              if [ "$bad" -ge 5 ]; then echo "::error::5 failed calls in a row (last HTTP $code)"; exit 1; fi
            else
              bad=0
              # a step that errored is reported inside a 200 response: fail the run so GitHub sends its failure notification
              if grep -q '"error:' out.json; then echo "::error::a cron step reported an error"; exit 1; fi
              if grep -Eq '"background_unfinished":[1-9]' out.json; then echo "::warning::background work was still running when the response was sent"; fi
              jq -e '.results.daily_discovery | (.done == false) or (.reason == "in_progress")' out.json >/dev/null 2>&1 || exit 0
            fi
            sleep 20
          done
          echo "::error::morning discovery still not done after 65 minutes"; exit 1
