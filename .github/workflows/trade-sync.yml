name: Trade sync

# Customs trade statistics -> trade_flow. Monthly (the previous month is published about two weeks after month end) and on demand.
# mode=probe makes one read-only call per API and reports what each answered; mode=sync fills the table.
on:
  schedule:
    - cron: '23 2 17 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe or sync'
        default: 'sync'
      months:
        description: 'months of history to (re)fetch per item (36 = monthly refresh; up to 360 for a backfill)'
        default: '36'
      limit:
        description: 'items per call (use 1 for a deep backfill so each call fits the time limit)'
        default: '6'
      probe_from:
        description: 'probe only: first month of an older year to test (YYYY01)'
        default: ''

concurrency:
  group: trade-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Call /api/cron/trade-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://oilfats-research.vercel.app' }}
          MODE: ${{ github.event.inputs.mode || 'sync' }}
          MONTHS: ${{ github.event.inputs.months || '36' }}
          LIMIT: ${{ github.event.inputs.limit || '6' }}
          PROBE_FROM: ${{ github.event.inputs.probe_from || '' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET secret is not set"; exit 1; fi
          case "$MODE" in probe|sync) ;; *) MODE=sync ;; esac
          call() { curl -sS -m 290 -o out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/trade-sync?mode=$MODE&offset=$1&months=$MONTHS&country_months=$MONTHS&limit=$LIMIT&probe_from=$PROBE_FROM" || true; }
          if [ "$MODE" = "probe" ]; then
            code=$(call 0); echo "HTTP $code"; head -c 3000 out.json; echo
            [ "$code" = "200" ] || { echo "::error::trade sync endpoint answered HTTP $code"; exit 1; }
            exit 0
          fi
          # sync runs in batches of a few headings per call (each call must finish inside the function limit); the response names the next offset
          offset=0; errors=0
          while [ -n "$offset" ] && [ "$offset" != "null" ]; do
            code=$(call "$offset"); echo "offset $offset: HTTP $code"; head -c 600 out.json; echo
            [ "$code" = "200" ] || { echo "::error::trade sync endpoint answered HTTP $code at offset $offset"; exit 1; }
            jq -e '.ok == true' out.json >/dev/null 2>&1 || errors=$((errors + 1))
            offset=$(jq -r '.next' out.json)
          done
          if [ "$errors" -gt 0 ]; then echo "::warning::trade sync finished with $errors batch(es) reporting errors"; fi
